<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Starred Words Storage</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .debug-section { 
            background: #f5f5f5; 
            padding: 15px; 
            margin: 15px 0; 
            border-radius: 5px; 
        }
        button { 
            background: #007cba; 
            color: white; 
            border: none; 
            padding: 8px 16px; 
            border-radius: 4px; 
            cursor: pointer; 
            margin: 5px;
        }
        pre { 
            background: #333; 
            color: #fff; 
            padding: 10px; 
            border-radius: 4px; 
            overflow-x: auto; 
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>🐛 Starred Words Storage Debug</h1>

    <div class="debug-section">
        <h3>Current Storage Content</h3>
        <button onclick="loadStorageContent()">🔄 Refresh Storage Content</button>
        <pre id="storage-content">Click "Refresh Storage Content" to load...</pre>
    </div>

    <div class="debug-section">
        <h3>Test Add Starred Word</h3>
        <input type="text" id="test-word" placeholder="Word" value="vestige">
        <input type="text" id="test-timestamp" placeholder="Timestamp" value="1724242933923">
        <button onclick="addTestStarredWord()">⭐ Add Test Word</button>
    </div>

    <div class="debug-section">
        <h3>Console Logs</h3>
        <p>Check browser console (F12) for detailed logs when adding words through word cards.</p>
        <button onclick="clearConsole()">🧹 Clear Console</button>
    </div>

    <script>
        // Mock chrome.storage.local for testing if not in extension context
        if (typeof chrome === 'undefined') {
            window.chrome = {
                storage: {
                    local: {
                        _data: {
                            starredWords: [
                                {
                                    word: "relic",
                                    timestamp: "1724242933923",
                                    definition: "遗迹，遗物",
                                    source: "legacy"
                                },
                                {
                                    word: "vestige", 
                                    timestamp: "1724242933923",
                                    definition: "痕迹，残余",
                                    source: "wordcard"
                                }
                            ]
                        },
                        get: function(keys, callback) {
                            let result = {};
                            if (typeof keys === 'string') {
                                result[keys] = this._data[keys];
                            } else if (Array.isArray(keys)) {
                                keys.forEach(key => {
                                    result[key] = this._data[key];
                                });
                            } else if (typeof keys === 'object') {
                                Object.keys(keys).forEach(key => {
                                    result[key] = this._data[key] || keys[key];
                                });
                            }
                            callback(result);
                        },
                        set: function(data, callback) {
                            Object.assign(this._data, data);
                            console.log('📝 Storage updated:', this._data);
                            if (callback) callback();
                            // Auto-refresh display
                            loadStorageContent();
                        }
                    }
                }
            };
        }

        function loadStorageContent() {
            chrome.storage.local.get(['starredWords', 'learnedItems'], (data) => {
                const content = {
                    starredWords: data.starredWords || [],
                    starredWordsCount: (data.starredWords || []).length,
                    learnedItems: data.learnedItems || [],
                    learnedItemsCount: (data.learnedItems || []).length
                };
                
                document.getElementById('storage-content').textContent = JSON.stringify(content, null, 2);
                
                console.log('Current storage content:', content);
            });
        }

        function addTestStarredWord() {
            const word = document.getElementById('test-word').value;
            const timestamp = document.getElementById('test-timestamp').value;
            
            chrome.storage.local.get({ starredWords: [] }, ({ starredWords }) => {
                // Support both old format (strings) and new format (objects)
                const starredSet = new Set();
                const starredObjects = [];
                
                (starredWords || []).forEach(item => {
                    if (typeof item === 'string') {
                        // Old format: "word::timestamp"
                        starredSet.add(item);
                        const [word, timestamp] = item.split('::');
                        starredObjects.push({
                            word: word,
                            timestamp: timestamp,
                            definition: null,
                            source: 'legacy'
                        });
                    } else {
                        // New format: object
                        const key = `${item.word}::${item.timestamp}`;
                        starredSet.add(key);
                        starredObjects.push(item);
                    }
                });
                
                const key = `${word}::${timestamp}`;
                
                console.log('Adding test starred word:', {
                    word: word,
                    timestamp: timestamp,
                    key: key,
                    existingStarredWords: starredWords
                });
                
                if (!starredSet.has(key)) {
                    const newStarredItem = {
                        word: word,
                        timestamp: timestamp,
                        definition: `Test definition for ${word}`,
                        source: 'test'
                    };
                    starredObjects.push(newStarredItem);
                    
                    chrome.storage.local.set({ starredWords: starredObjects }, () => {
                        console.log('Updated starred words:', starredObjects);
                        alert(`Added: ${key}`);
                    });
                } else {
                    alert(`Already exists: ${key}`);
                }
            });
        }

        function clearConsole() {
            console.clear();
        }

        // Auto-load on page load
        document.addEventListener('DOMContentLoaded', loadStorageContent);
    </script>
</body>
</html>
