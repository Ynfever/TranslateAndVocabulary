<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Review</title>
    <link rel="stylesheet" href="../styles/review.css">
    <link href="https://fonts.googleapis.com/css2?family=Headland+One&family=Inter&display=swap" rel="stylesheet">
</head>
<body>
    <div class="review-container">
        <div class="counter">
            <span id="current-word">1</span> / <span id="total-words">0</span>
        </div>
        <button id="back-button" class="nav-button">
            <svg width="50" height="50" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M15 18L9 12L15 6" stroke="#d1d1d1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
        <div class="card-container">
            <div class="word-section">
                <h1 id="word"></h1>
                <p id="definition"></p>
            </div>
            <div class="details-section">
                <div class="detail-group">
                    <div class="detail-header">
                        <h2>等价词</h2>
                        <div class="underline equivalent"></div>
                    </div>
                    <ul id="equivalent-words-list"></ul>
                </div>
                <div class="detail-group">
                    <div class="detail-header">
                        <h2>易混淆词</h2>
                        <div class="underline confusable"></div>
                    </div>
                    <ul id="confusable-words-list"></ul>
                </div>
                <div class="detail-group" id="example-container">
                    <div class="detail-header">
                        <h2 id="example-title">例句</h2>
                        <div class="underline example"></div>
                    </div>
                    <p id="example-text"></p>
                </div>
                <div class="detail-group" id="mcq-container" style="display: none;">
                    <div class="detail-header">
                        <h2>例题</h2>
                        <div class="underline mcq"></div>
                    </div>
                    <p id="mcq-question"></p>
                    <ul id="mcq-options-list"></ul>
                </div>
            </div>
        </div>
        <button id="next-button" class="nav-button">
            <svg width="50" height="50" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M15 18L9 12L15 6" stroke="#d1d1d1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
    </div>
    <script src="../scripts/review.js"></script>
</body>
</html>
