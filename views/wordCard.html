<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Card</title>
    <link rel="stylesheet" href="../styles/wordCard.css">
</head>
<body>
    <div class="card-container">
        <div class="word-section">
            <button id="star-btn" class="star-btn" title="Star" aria-label="Star word" aria-pressed="false">
                <svg width="28" height="28" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
                </svg>
            </button>
            <h1 id="word">relic</h1>
            <p id="definition">遗物 (遗迹，遗物)</p>
        </div>
        <div class="details-section">
            <div class="detail-group">
                <div class="detail-header">
                    <h2>等价词</h2>
                    <div class="underline equivalent"></div>
                </div>
                <ul id="equivalent-words-list"></ul>
            </div>
            <div class="detail-group">
                <div class="detail-header">
                    <h2>易混淆词</h2>
                    <div class="underline confusable"></div>
                </div>
                <ul id="confusable-words-list"></ul>
            </div>
            <div class="detail-group" id="example-container">
                <div class="detail-header">
                    <h2 id="example-title">例句</h2>
                    <div class="underline example"></div>
                </div>
                <p id="example-text"></p>
            </div>
            <div class="detail-group" id="mcq-container" style="display: none;">
                <div class="detail-header">
                    <h2>例题</h2>
                    <div class="underline mcq"></div>
                </div>
                <p id="mcq-question"></p>
                <ul id="mcq-options-list"></ul>
            </div>
        </div>
    </div>
    <script src="../scripts/vocabulary-merger.js"></script>
    <script src="../scripts/wordCard.js"></script>
</body>
</html>
